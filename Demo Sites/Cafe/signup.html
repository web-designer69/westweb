<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Common Ground</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="top-bar">

        <button class="menu-button" id="menuButton" aria-label="Open menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <a href="index.html" class="logo">
            COMMON GROUND
        </a>

        <a href="signin.html" class="signin-button" id="accountButton">
            SIGN IN
        </a>

    </header>


    <aside class="side-menu" id="sideMenu">

        <button class="close-menu" id="closeMenu">×</button>

        <p class="menu-label">COMMON GROUND</p>

        <nav>
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>

        <div class="menu-footer">
            <a href="signin.html">Sign in</a>
            <a href="signup.html">Create an account</a>
        </div>

    </aside>

    <div class="menu-overlay" id="menuOverlay"></div>


    <main class="auth-page">

        <section class="auth-card">

            <p class="eyebrow">JOIN COMMON GROUND</p>

            <h1>Create an account.</h1>

            <p class="auth-description">
                Create your free Common Ground account.
            </p>


            <form id="signupForm">

                <label for="signupName">Your name</label>
                <input
                    type="text"
                    id="signupName"
                    placeholder="Your name"
                    required
                >

                <label for="signupEmail">Email address</label>
                <input
                    type="email"
                    id="signupEmail"
                    placeholder="you@example.com"
                    required
                >

                <label for="signupPassword">Password</label>
                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Choose a password"
                    required
                >

                <button type="submit" class="primary-button">
                    CREATE ACCOUNT
                </button>

            </form>


            <p class="auth-switch">
                Already have an account?
                <a href="signin.html">Sign in</a>
            </p>

        </section>

    </main>
    <button class="westweb-return" id="westwebReturn">
        ← WESTWEB
    </button>

    <script src="script.js"></script>

</body>
</html>
