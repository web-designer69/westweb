<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Common Ground</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="top-bar">

        <button class="menu-button" id="menuButton" aria-label="Open menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <a href="index.html" class="logo">
            COMMON GROUND
        </a>

        <a href="signin.html" class="signin-button" id="accountButton">
            SIGN IN
        </a>

    </header>


    <aside class="side-menu" id="sideMenu">

        <button class="close-menu" id="closeMenu">×</button>

        <p class="menu-label">COMMON GROUND</p>

        <nav>
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>

        <div class="menu-footer">
            <a href="signin.html">Sign in</a>
            <a href="signup.html">Create an account</a>
        </div>

    </aside>

    <div class="menu-overlay" id="menuOverlay"></div>


    <main class="auth-page">

        <section class="auth-card">

            <p class="eyebrow">WELCOME BACK</p>

            <h1>Sign in.</h1>

            <p class="auth-description">
                Sign in to your Common Ground account.
            </p>


            <form id="signinForm">

                <label for="signinEmail">Email address</label>
                <input
                    type="email"
                    id="signinEmail"
                    placeholder="you@example.com"
                    required
                >

                <label for="signinPassword">Password</label>
                <input
                    type="password"
                    id="signinPassword"
                    placeholder="Your password"
                    required
                >

                <button type="submit" class="primary-button">
                    SIGN IN
                </button>

            </form>


            <p class="auth-switch">
                Don't have an account?
                <a href="signup.html">Create one</a>
            </p>

        </section>

    </main>
    <button class="westweb-return" id="westwebReturn">
        ← WESTWEB
    </button>

    <script src="script.js"></script>

</body>
</html>
