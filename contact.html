<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact — WESTWEB</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
    <a href="index.html" class="logo">
        <img src="Assets/westweb-w.png" alt="WESTWEB">
        <span>WESTWEB</span>
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#work">Our Work</a>
        <a href="packages.html">Packages</a>
        <a href="contact.html">Contact</a>
    </nav>

    <button class="menu-toggle" aria-label="Open menu" aria-expanded="false">
        ☰
    </button>
</header>

<div class="mobile-menu">
    <a href="index.html">Home</a>
    <a href="index.html#work">Our Work</a>
    <a href="packages.html">Packages</a>
    <a href="contact.html">Contact</a>
</div>
    <main>

        <section class="contact-page">

            <p class="eyebrow">LET'S WORK TOGETHER</p>

            <h1>
                READY TO<br>
                <span>STAND OUT?</span>
            </h1>

            <p class="contact-text">
                Tell us about your business and what you need.
                Let's build something that gets noticed.
            </p>

            <form class="contact-form" id="contact-form" action="https://api.web3forms.com/submit" method="POST">

    <input type="hidden" name="access_key" value="f36adcca-39e1-4c6e-8cc5-58c59eee8427">
    <input type="hidden" name="subject" value="New enquiry from west-web.co.uk">
    <input type="hidden" name="from_name" value="WESTWEB Contact Form">
    <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">

    <!-- your existing form-group divs stay exactly as they are -->
    <div class="form-group">
        <label for="name">YOUR NAME</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>
    </div>

    <div class="form-group">
        <label for="business">BUSINESS NAME</label>
        <input type="text" id="business" name="business" placeholder="Your business" required>
    </div>

    <div class="form-group">
        <label for="email">EMAIL ADDRESS</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
    </div>

    <div class="form-group">
        <label for="package">PACKAGE</label>
        <select id="package" name="package">
            <option value="">Select a package</option>
            <option value="Starter - £399">Starter — £399</option>
            <option value="Professional - £499">Professional — £499</option>
            <option value="Not sure yet">Not sure yet</option>
        </select>
    </div>

    <div class="form-group">
        <label for="message">TELL US ABOUT YOUR PROJECT</label>
        <textarea id="message" name="message" rows="7" placeholder="Tell us about your business and what you'd like your website to do." required></textarea>
    </div>

    <button type="submit" class="button">SEND ENQUIRY →</button>

    <p id="form-status" role="status" style="margin-top:1rem;"></p>

</form>

        </section>

    </main>

    <footer>

        <div class="footer-brand">
            <div class="logo">
                <img src="Assets/westweb-w.png" alt="WESTWEB">
                <span>WESTWEB</span>
            </div>

            <p>Websites that stand out.</p>
        </div>

        <p class="copyright">© 2026 WESTWEB. All rights reserved.</p>

    </footer>

    <script src="script.js"></script>

<script>
const form = document.getElementById('contact-form');
const status = document.getElementById('form-status');
const submitBtn = form.querySelector('button[type="submit"]');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const originalText = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = 'SENDING...';
    status.textContent = '';

    try {
        const response = await fetch(form.action, {
            method: 'POST',
            headers: { 'Accept': 'application/json' },
            body: new FormData(form)
        });
        const result = await response.json();

        if (response.ok && result.success) {
            status.textContent = "Thanks! Your enquiry has been sent. I'll be in touch soon.";
            form.reset();
        } else {
            status.textContent = 'Something went wrong. Please try again or email me directly.';
        }
    } catch (err) {
        status.textContent = 'Network error. Please try again in a moment.';
    }

    submitBtn.disabled = false;
    submitBtn.textContent = originalText;
});
</script>
    
</body>
</html>
