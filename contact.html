<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact — WESTWEB</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <a href="index.html" class="logo">
            <img src="Assets/westweb-w.png" alt="WESTWEB">
            <span>WESTWEB</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="packages.html">Packages</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <section class="contact-page">

            <p class="eyebrow">LET'S WORK TOGETHER</p>

            <h1>
                READY TO<br>
                <span>STAND OUT?</span>
            </h1>

            <p class="contact-text">
                Tell us about your business and what you need.
                Let's build something that gets noticed.
            </p>

            <form class="contact-form">

                <div class="form-group">
                    <label for="name">YOUR NAME</label>
                    <input type="text" id="name" name="name" placeholder="Your name" required>
                </div>

                <div class="form-group">
                    <label for="business">BUSINESS NAME</label>
                    <input type="text" id="business" name="business" placeholder="Your business" required>
                </div>

                <div class="form-group">
                    <label for="email">EMAIL ADDRESS</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="package">PACKAGE</label>

                    <select id="package" name="package">
                        <option value="">Select a package</option>
                        <option value="starter">Starter — £399</option>
                        <option value="professional">Professional — £499</option>
                        <option value="not-sure">Not sure yet</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">TELL US ABOUT YOUR PROJECT</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="7"
                        placeholder="Tell us about your business and what you'd like your website to do."
                        required
                    ></textarea>
                </div>

                <button type="submit" class="button">
                    SEND ENQUIRY →
                </button>

            </form>

        </section>

    </main>

    <footer>

        <div class="footer-brand">
            <div class="logo">
                <img src="Assets/westweb-w.png" alt="WESTWEB">
                <span>WESTWEB</span>
            </div>

            <p>Websites that stand out.</p>
        </div>

        <p class="copyright">© 2026 WESTWEB. All rights reserved.</p>

    </footer>

</body>
</html>
